<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bonapeche AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="topbar">

      <div>
        <h1>Bonapeche AI</h1>
        <p>نظام إدارة الشركة</p>
      </div>

      <button
        id="logoutBtn"
        class="secondary hidden"
        type="button"
      >
        تسجيل الخروج
      </button>

    </header>


    <!-- ============================= -->
    <!-- LOGIN -->
    <!-- ============================= -->

    <section
      id="loginView"
      class="card"
    >

      <h2>تسجيل الدخول</h2>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        type="button"
      >
        تسجيل الدخول
      </button>

      <p
        id="loginStatus"
        class="status"
      ></p>

    </section>


    <!-- ============================= -->
    <!-- MAIN APPLICATION -->
    <!-- ============================= -->

    <section
      id="appView"
      class="hidden"
    >

      <!-- ============================= -->
      <!-- DASHBOARD -->
      <!-- ============================= -->

      <section
        id="dashboard"
        class="dashboard"
      >

        <div
          class="dashboard-card"
          data-window="inventoryWindow"
        >
          <div class="dashboard-icon">📦</div>
          <h3>المخزون</h3>
          <p>معرفة المخزون الحالي</p>
        </div>


        <div
          class="dashboard-card"
          data-window="purchasesWindow"
        >
          <div class="dashboard-icon">🛒</div>
          <h3>المشتريات</h3>
          <p>تسجيل ومراجعة المشتريات</p>
        </div>


        <div
          class="dashboard-card"
          data-window="salesWindow"
        >
          <div class="dashboard-icon">💰</div>
          <h3>المبيعات</h3>
          <p>تسجيل ومراجعة المبيعات</p>
        </div>


        <div
          class="dashboard-card"
          data-window="peopleWindow"
        >
          <div class="dashboard-icon">👥</div>
          <h3>العملاء والموردون</h3>
          <p>إدارة بيانات الأشخاص</p>
        </div>


        <div
          class="dashboard-card"
          data-window="reportsWindow"
        >
          <div class="dashboard-icon">📊</div>
          <h3>التقارير</h3>
          <p>التقارير المالية والتشغيلية</p>
        </div>


        <div
          class="dashboard-card"
          data-window="aiWindow"
        >
          <div class="dashboard-icon">🤖</div>
          <h3>Bonapeche AI</h3>
          <p>المساعد الذكي للشركة</p>
        </div>

      </section>


      <!-- ============================= -->
      <!-- INVENTORY WINDOW -->
      <!-- ============================= -->

      <section
        id="inventoryWindow"
        class="module-window hidden"
      >

        <div class="window-header">

          <h2>📦 المخزون الحالي</h2>

          <button
            class="close-window secondary"
            type="button"
          >
            رجوع
          </button>

        </div>

          <button
            id="
