<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonapeche AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar">
<div><h1>Bonapeche AI</h1><p>مساعد إدارة الشركة</p></div>
<button id="logoutBtn" class="secondary hidden">تسجيل الخروج</button>
</header>

<section id="loginView" class="card">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<p id="loginStatus" class="status"></p>
</section>

<section id="chatView" class="card hidden">
<h2>Bonapeche AI</h2>
<textarea id="message" rows="5" placeholder="اكتب طلبك هنا... مثال: كم مخزون ABAE؟"></textarea>
<button id="sendBtn">إرسال</button>
<div id="response" class="response">ستظهر إجابة الوكيل هنا.</div>
<p id="chatStatus" class="status"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
